<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbc98b"/>
      <stop offset=".45" stop-color="#fdd9a8"/>
      <stop offset="1" stop-color="#fdebd0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c08d"/>
      <stop offset=".25" stop-color="#9fc4b8"/>
      <stop offset="1" stop-color="#5f948f"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bầu trời hoàng hôn -->
  <rect width="1600" height="560" fill="url(#sky)"/>
  <circle cx="1120" cy="330" r="190" fill="url(#sunGlow)"/>
  <circle cx="1120" cy="330" r="52" fill="#ffcf6f"/>

  <!-- Chim -->
  <g stroke="#7d6a55" stroke-width="4" fill="none" stroke-linecap="round" opacity=".55">
    <path d="M320 220 q14 -12 28 0 q14 -12 28 0"/>
    <path d="M420 260 q11 -9 22 0 q11 -9 22 0"/>
    <path d="M262 300 q9 -8 18 0 q9 -8 18 0"/>
  </g>

  <!-- Dãy đảo xa (sương mờ) -->
  <path fill="#9db8a8" opacity=".38" d="M0 470 Q90 400 200 452 Q290 380 400 448 Q520 392 640 452 Q760 386 880 446 Q1000 396 1120 448 Q1240 388 1360 448 Q1480 400 1600 452 L1600 560 L0 560 Z"/>

  <!-- Dãy đảo giữa -->
  <path fill="#5f8f7c" opacity=".62" d="M0 505 Q130 430 260 496 Q360 428 480 494 Q610 424 740 494 Q870 432 1000 496 Q1130 428 1260 494 Q1390 434 1520 496 L1600 490 L1600 560 L0 560 Z"/>

  <!-- Đảo gần (núi vôi Hạ Long) -->
  <path fill="#3f7263" opacity=".85" d="M-40 560 Q120 400 300 545 Q340 470 430 540 Q560 430 700 552 L700 560 Z"/>
  <path fill="#356253" opacity=".88" d="M1500 560 Q1560 430 1660 555 L1660 560 Z"/>

  <!-- Mặt nước -->
  <rect y="560" width="1600" height="340" fill="url(#sea)"/>

  <!-- Vệt sáng mặt trời trên nước -->
  <g fill="#ffe9bd">
    <rect x="1040" y="575" width="160" height="5" rx="2.5" opacity=".75"/>
    <rect x="1070" y="598" width="120" height="4" rx="2" opacity=".6"/>
    <rect x="1030" y="622" width="180" height="4" rx="2" opacity=".45"/>
    <rect x="1085" y="650" width="90" height="4" rx="2" opacity=".35"/>
    <rect x="1055" y="682" width="140" height="3" rx="1.5" opacity=".25"/>
  </g>

  <!-- Sóng gợn nhẹ -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".25">
    <path d="M180 610 h70"/><path d="M300 660 h56"/><path d="M520 640 h80"/>
    <path d="M760 700 h64"/><path d="M940 626 h52"/><path d="M1320 690 h72"/>
    <path d="M240 740 h60"/><path d="M1180 760 h84"/>
  </g>

  <!-- Thuyền thúng -->
  <g opacity=".9">
    <path d="M300 706 Q360 738 420 706 L404 700 Q360 716 316 700 Z" fill="#4a3b2c"/>
    <path d="M352 700 L352 668 Q376 680 366 700 Z" fill="#5d4a36"/>
    <rect x="349" y="666" width="4" height="36" fill="#4a3b2c"/>
    <path d="M250 724 h220" stroke="#ffffff" stroke-width="4" opacity=".2" stroke-linecap="round"/>
  </g>
</svg>
