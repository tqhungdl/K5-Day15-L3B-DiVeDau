# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Số chưa có nguồn ghi rõ "(tự ước tính)".

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số khách quốc tế gặp sự cố VÀ dùng TravelSOS trong một tháng, ở quy mô thật
                    # cơ sở = 21,2 triệu lượt khách / 12 tháng × 0,5% gặp sự cố × 5% dùng; thấp 1%, cao 10% (làm tròn)
  low: 90
  base: 440
  high: 880
  source: "21,2 triệu lượt khách quốc tế năm 2025: https://en.baochinhphu.vn/print/foreign-arrivals-soar-to-record-high-in-2025-111260106100233228.htm (xem 27/11/2026). Tỉ lệ gặp sự cố 0,5% và tỉ lệ dùng 1% / 5% / 10%: (tự ước tính)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1. Chia theo độ dài vụ việc
  - name: hoi_mot_lan
    share: 0.5              # hỏi một việc rồi tự làm (vd xin câu tiếng Việt, hỏi nên báo ai)
    uses_per_month: 1       # số phiên / người / tháng
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "share, số phiên, số lượt: (tự ước tính)"
  - name: su_co_trong_ngay
    share: 0.3              # lỡ chuyến, mất phòng: xử lý trong vài giờ
    uses_per_month: 1
    turns_per_session: 3
    source: "Phỏng vấn P2 (chờ gần 4 giờ), P3 (2-3 tiếng) chỉ cho biết sự cố gói trong một ngày; share, số phiên, số lượt: (tự ước tính)"
  - name: mat_ho_chieu_nhieu_ngay
    share: 0.2              # quay lại hỏi theo từng bước: công an, cơ quan đại diện, Xuất nhập cảnh
    uses_per_month: 3
    turns_per_session: 3
    source: "Phỏng vấn P1 (kể về người quen, gần một tuần) và quy trình 3 bước ở docs/prd.md §1; share, số phiên, số lượt: (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token, giá chuẩn (không batch), ngữ cảnh ngắn. ≥2 mức model
  - model: gpt-6-luna       # model dự định chạy thật
    input: 0.10
    output: 0.50
    source: "https://developers.openai.com/api/docs/pricing · xem 27/11/2026"
  - model: gpt-6.1-terra    # mức mạnh hơn để so
    input: 1.00
    output: 5.00
    source: "https://developers.openai.com/api/docs/pricing · xem 27/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
